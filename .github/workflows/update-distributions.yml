# 주배당·월배당 종목의 최근 분배금 데이터(public/distributions.json)를 매주 갱신해요.
# 바뀐 내용이 있으면 main에 커밋 → Vercel이 자동으로 다시 배포해요.
# 수집이 대부분 실패하면(출처 차단·형식 변경) 파일을 건드리지 않고 이 작업이 실패로 표시돼요.
# Actions 탭에서 "Run workflow" 버튼으로 바로 실행할 수도 있어요.
name: Update distributions

on:
  schedule:
    # 매주 토요일 09:17 KST (금요일 미국장 마감 후, 주배당 ETF 공시가 대부분 반영된 뒤)
    - cron: '17 0 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-distributions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch distributions
        run: node scripts/fetch-distributions.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- public/distributions.json && git ls-files --error-unmatch public/distributions.json >/dev/null 2>&1; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/distributions.json
          git commit -m "Update distributions data"
          git push
